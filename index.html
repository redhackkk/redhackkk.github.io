<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REDHACK</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            overflow-x: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 40px;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Üst Menü / Görsel Kapsayıcısı (Yan yana dizilim için) */
        .top-menu {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 25px; /* Elemanlar arasındaki boşluk */
            flex-wrap: wrap; /* Mobilde alt alta geçebilmesi için */
            max-width: 90%;
        }

        .menu-item {
            text-decoration: none;
            display: block;
        }

        .menu-item img {
            max-width: 200px;
            width: 100%;
            height: auto;
            border: 2px solid #ff0000;
            box-shadow: 0 0 15px #ff0000;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: block;
        }

        .menu-item img:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px #ff0000;
        }
    </style>
</head>
<body>

    <canvas id="starsCanvas"></canvas>

    <!-- Üst Kısım (Görseller yan yana buraya eklenecek) -->
    <div class="top-menu">
        
        <!-- BİZ KİMİZ (kimdir.jpg) -->
        <a href="biz-kimiz/index.html" class="menu-item">
            <img src="kimdir.jpg" alt="Biz Kimiz" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'200\' height=\'120\'><rect width=\'100%\' height=\'100%\' fill=\'%23000\' border=\'1\'/><text x=\'50%\' y=\'50%\' fill=\'%23ff0000\' font-family=\'monospace\' font-size=\'14\' text-anchor=\'middle\'>[ kimdir.jpg ]</text></svg>';">
        </a>

        <!-- Yakında eklenecek yeni öğeleri buraya aynı yapıda ekleyebilirsin:
        <a href="yeni-sayfa/index.html" class="menu-item">
            <img src="yeni-gorsel.jpg" alt="Yeni Sayfa">
        </a>
        -->

    </div>

    <script>
        const canvas = document.getElementById('starsCanvas');
        const ctx = canvas.getContext('2d');

        let stars = [];
        const numStars = 150;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function drawFivePointStar(ctx, cx, cy, spikes, outerRadius, innerRadius, alpha) {
            let rot = Math.PI / 2 * 3;
            let x = cx;
            let y = cy;
            let step = Math.PI / spikes;

            ctx.save();
            ctx.beginPath();
            ctx.moveTo(cx, cy - outerRadius);

            for (let i = 0; i < spikes; i++) {
                x = cx + Math.cos(rot) * outerRadius;
                y = cy + Math.sin(rot) * outerRadius;
                ctx.lineTo(x, y);
                rot += step;

                x = cx + Math.cos(rot) * innerRadius;
                y = cy + Math.sin(rot) * innerRadius;
                ctx.lineTo(x, y);
                rot += step;
            }

            ctx.lineTo(cx, cy - outerRadius);
            ctx.closePath();

            ctx.fillStyle = `rgba(255, 0, 0, ${alpha})`;
            ctx.shadowBlur = 12;
            ctx.shadowColor = '#ff0000';
            ctx.fill();
            ctx.restore();
        }

        class Star {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.outerRadius = Math.random() * 5 + 3;
                this.innerRadius = this.outerRadius / 2;
                this.alpha = Math.random();
                this.speed = Math.random() * 0.02 + 0.005;
                this.increasing = Math.random() > 0.5;
            }

            draw() {
                drawFivePointStar(ctx, this.x, this.y, 5, this.outerRadius, this.innerRadius, this.alpha);
            }

            update() {
                if (this.increasing) {
                    this.alpha += this.speed;
                    if (this.alpha >= 1) this.increasing = false;
                } else {
                    this.alpha -= this.speed;
                    if (this.alpha <= 0.05) this.increasing = true;
                }
            }
        }

        function initStars() {
            stars = [];
            for (let i = 0; i < numStars; i++) {
                stars.push(new Star());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(star => {
                star.update();
                star.draw();
            });
            requestAnimationFrame(animate);
        }

        initStars();
        animate();
    </script>
</body>
</html>
