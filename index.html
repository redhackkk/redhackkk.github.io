<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REDHACK</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            overflow-x: hidden;
            min-height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 40px 20px;
            font-family: "Courier New", Courier, monospace;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* BANNER & SLOGAN AREA */
        .brand-header {
            position: relative;
            z-index: 2;
            text-align: center;
            margin-bottom: 35px;
        }

        .main-title {
            font-size: 3rem;
            color: #ff0000;
            text-shadow: 0 0 15px #ff0000;
            letter-spacing: 4px;
            font-weight: bold;
        }

        .slogan {
            font-size: 1.2rem;
            color: #dd0000;
            text-shadow: 0 0 8px rgba(255, 0, 0, 0.7);
            margin-top: 5px;
            letter-spacing: 1px;
        }

        .since {
            font-size: 0.9rem;
            color: #888888;
            margin-top: 3px;
            letter-spacing: 2px;
        }

        /* SEARCH BOX AREA */
        .search-container {
            position: relative;
            z-index: 2;
            margin-bottom: 35px;
            width: 100%;
            max-width: 450px;
        }

        .search-form {
            display: flex;
            border: 1px solid #ff0000;
            background-color: rgba(5, 5, 5, 0.8);
            box-shadow: 0 0 12px rgba(255, 0, 0, 0.4);
        }

        .search-input {
            background: transparent;
            border: none;
            padding: 10px 15px;
            color: #ff0000;
            font-family: "Courier New", Courier, monospace;
            font-size: 1rem;
            width: 100%;
            outline: none;
        }

        .search-input::placeholder {
            color: #770000;
        }

        .search-button {
            background-color: #ff0000;
            color: #000000;
            border: none;
            padding: 10px 18px;
            font-family: "Courier New", Courier, monospace;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s, box-shadow 0.2s;
        }

        .search-button:hover {
            background-color: #cc0000;
            box-shadow: 0 0 10px #ff0000;
        }

        /* TOP MENU AREA */
        .top-menu {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 25px;
            flex-wrap: wrap;
            max-width: 90%;
        }

        .menu-item {
            text-decoration: none;
            display: block;
        }

        .menu-item img {
            max-width: 200px;
            width: 100%;
            height: auto;
            border: 2px solid #ff0000;
            box-shadow: 0 0 15px #ff0000;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: block;
        }

        .menu-item img:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px #ff0000;
        }
    </style>
</head>
<body>

    <canvas id="starsCanvas"></canvas>

    <!-- REDHACK BASLIK & SLOGAN -->
    <div class="brand-header">
        <div class="main-title">RedHack</div>
        <div class="slogan">Halk için Hack!</div>
        <div class="since">Since 1997</div>
    </div>

    <!-- SITEDE ARA MODULU -->
    <div class="search-container">
        <form class="search-form" onsubmit="handleSearch(event)">
            <input type="text" id="searchInput" class="search-input" placeholder="Sitede ara..." required>
            <button type="submit" class="search-button">ARA</button>
        </form>
    </div>

    <!-- UST MENU -->
    <div class="top-menu">
        <!-- BİZ KİMİZ -->
        <a href="biz-kimiz/index.html" class="menu-item">
            <img src="kimdir.jpg" alt="Biz Kimiz" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'200\' height=\'120\'><rect width=\'100%\' height=\'100%\' fill=\'%23000\' border=\'1\'/><text x=\'50%\' y=\'50%\' fill=\'%23ff0000\' font-family=\'monospace\' font-size=\'14\' text-anchor=\'middle\'>[ kimdir.jpg ]</text></svg>';">
        </a>

        <!-- FOTO GALERİ -->
        <a href="foto-galeri/index.html" class="menu-item">
            <img src="fotogaleri.jpg" alt="Foto Galeri" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'200\' height=\'120\'><rect width=\'100%\' height=\'100%\' fill=\'%23000\' border=\'1\'/><text x=\'50%\' y=\'50%\' fill=\'%23ff0000\' font-family=\'monospace\' font-size=\'14\' text-anchor=\'middle\'>[ fotogaleri.jpg ]</text></svg>';">
        </a>

        <!-- HACKLENEN SİTELER -->
        <a href="hacklenen-siteler/index.html" class="menu-item">
            <img src="404.jpg" alt="Hacklenen Siteler" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'200\' height=\'120\'><rect width=\'100%\' height=\'100%\' fill=\'%23000\' border=\'1\'/><text x=\'50%\' y=\'50%\' fill=\'%23ff0000\' font-family=\'monospace\' font-size=\'14\' text-anchor=\'middle\'>[ 404.jpg ]</text></svg>';">
        </a>
    </div>

    <script>
        // SİTEDE ARAMA YÖNLENDİRME SCRIPT'İ
        function handleSearch(e) {
            e.preventDefault();
            const query = document.getElementById('searchInput').value.toLowerCase().trim();

            if (query.includes('kim') || query.includes('biz') || query.includes('manifesto') || query.includes('hakkında')) {
                window.location.href = 'biz-kimiz/index.html';
            } else if (query.includes('foto') || query.includes('galeri') || query.includes('resim') || query.includes('görsel')) {
                window.location.href = 'foto-galeri/index.html';
            } else if (query.includes('hack') || query.includes('site') || query.includes('log') || query.includes('404')) {
                window.location.href = 'hacklenen-siteler/index.html';
            } else {
                alert('Arama sonucu bulunamadı: "' + query + '"');
            }
        }

        // KIZIL YILDIZ ARKA PLAN ANIMASYONU
        const canvas = document.getElementById('starsCanvas');
        const ctx = canvas.getContext('2d');

        let stars = [];
        const numStars = 150;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function drawFivePointStar(ctx, cx, cy, spikes, outerRadius, innerRadius, alpha) {
            let rot = Math.PI / 2 * 3;
            let x = cx;
            let y = cy;
            let step = Math.PI / spikes;

            ctx.save();
            ctx.beginPath();
            ctx.moveTo(cx, cy - outerRadius);

            for (let i = 0; i < spikes; i++) {
                x = cx + Math.cos(rot) * outerRadius;
                y = cy + Math.sin(rot) * outerRadius;
                ctx.lineTo(x, y);
                rot += step;

                x = cx + Math.cos(rot) * innerRadius;
                y = cy + Math.sin(rot) * innerRadius;
                ctx.lineTo(x, y);
                rot += step;
            }

            ctx.lineTo(cx, cy - outerRadius);
            ctx.closePath();

            ctx.fillStyle = `rgba(255, 0, 0, ${alpha})`;
            ctx.shadowBlur = 12;
            ctx.shadowColor = '#ff0000';
            ctx.fill();
            ctx.restore();
        }

        class Star {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.outerRadius = Math.random() * 5 + 3;
                this.innerRadius = this.outerRadius / 2;
                this.alpha = Math.random();
                this.speed = Math.random() * 0.02 + 0.005;
                this.increasing = Math.random() > 0.5;
            }

            draw() {
                drawFivePointStar(ctx, this.x, this.y, 5, this.outerRadius, this.innerRadius, this.alpha);
            }

            update() {
                if (this.increasing) {
                    this.alpha += this.speed;
                    if (this.alpha >= 1) this.increasing = false;
                } else {
                    this.alpha -= this.speed;
                    if (this.alpha <= 0.05) this.increasing = true;
                }
            }
        }

        function initStars() {
            stars = [];
            for (let i = 0; i < numStars; i++) {
                stars.push(new Star());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(star => {
                star.update();
                star.draw();
            });
            requestAnimationFrame(animate);
        }

        initStars();
        animate();
    </script>
</body>
</html>
