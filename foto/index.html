<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foto Galeri — RedHack</title>
    <meta name="description" content="RedHack foto galerisi.">
    <meta name="theme-color" content="#e10600">
    <link rel="icon" type="image/jpeg" href="../ge.jpg">
    <style>
        :root {
            --red: #e10600;
            --red-bright: #ff2b2b;
            --red-dark: #7a0300;
            --yellow: #ffd400;
            --yellow-dim: #b39500;
            --white: #f5f5f5;
            --green: #00ff41;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            background: radial-gradient(ellipse at top, #2a0000 0%, #1a0000 40%, #0d0000 100%);
            background-attachment: fixed;
            color: var(--white);
            font-family: "Courier New", Courier, monospace;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            width: 100%;
            position: relative;
            overflow-x: hidden;
        }

        #starsCanvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .scanlines {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background: repeating-linear-gradient(
                to bottom,
                rgba(255, 212, 0, 0.03) 0px,
                rgba(255, 212, 0, 0.03) 1px,
                transparent 1px,
                transparent 3px
            );
            mix-blend-mode: screen;
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 960px;
            width: 100%;
            border: 1px solid var(--red);
            padding: 35px 40px;
            background-color: rgba(20, 0, 0, 0.85);
            box-shadow:
                0 0 25px rgba(225, 6, 0, 0.5),
                inset 0 0 40px rgba(225, 6, 0, 0.06);
            backdrop-filter: blur(2px);
        }

        .corner {
            position: absolute;
            color: var(--yellow);
            font-weight: bold;
            font-size: 1.1rem;
            text-shadow: 0 0 8px var(--yellow);
            pointer-events: none;
            user-select: none;
        }
        .corner.tl { top: 4px; left: 8px; }
        .corner.tr { top: 4px; right: 8px; }
        .corner.bl { bottom: 4px; left: 8px; }
        .corner.br { bottom: 4px; right: 8px; }

        h1 {
            font-size: 2rem;
            color: var(--red-bright);
            text-shadow: 0 0 12px var(--red), 0 0 25px var(--red-dark);
            margin-bottom: 6px;
            letter-spacing: 3px;
            min-height: 2.4rem;
        }

        .typewriter::after {
            content: "▊";
            color: var(--yellow);
            animation: blink 1s steps(1) infinite;
            margin-left: 4px;
        }
        @keyframes blink { 50% { opacity: 0; } }

        .page-sub {
            color: var(--yellow);
            font-size: 0.9rem;
            letter-spacing: 2px;
            margin-bottom: 8px;
            text-shadow: 0 0 8px rgba(255, 212, 0, 0.6);
        }

        .page-meta {
            color: rgba(245, 245, 245, 0.55);
            font-size: 0.8rem;
            letter-spacing: 1px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px dashed var(--red);
        }

        .page-meta .green {
            color: var(--green);
            text-shadow: 0 0 6px var(--green);
        }

        /* ===== GALERİ GRID ===== */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 18px;
        }

        .photo-card {
            position: relative;
            display: block;
            border: 2px solid var(--red);
            background-color: #0a0000;
            box-shadow: 0 0 15px rgba(225, 6, 0, 0.5);
            cursor: pointer;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
        }

        .photo-card img {
            display: block;
            width: 100%;
            height: 180px;
            object-fit: cover;
            filter: saturate(1.1) contrast(1.05);
            transition: transform 0.4s ease, filter 0.3s ease;
        }

        .photo-card .caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.95));
            color: var(--white);
            font-size: 0.85rem;
            letter-spacing: 2px;
            padding: 22px 12px 10px;
            text-align: center;
            font-weight: bold;
            text-shadow: 0 0 8px var(--red);
            pointer-events: none;
        }

        .photo-card:hover,
        .photo-card:focus-visible {
            transform: translateY(-4px) scale(1.02);
            border-color: var(--yellow);
            box-shadow: 0 0 30px var(--yellow);
            outline: none;
        }

        .photo-card:hover img,
        .photo-card:focus-visible img {
            transform: scale(1.06);
            filter: saturate(1.3) contrast(1.1);
        }

        .photo-card:hover .caption,
        .photo-card:focus-visible .caption {
            color: var(--yellow);
            text-shadow: 0 0 10px var(--yellow);
        }

        /* ===== LIGHTBOX ===== */
        .lightbox {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .lightbox.active {
            display: flex;
            opacity: 1;
        }

        .lightbox .lb-img-wrap {
            position: relative;
            max-width: 90vw;
            max-height: 85vh;
            border: 2px solid var(--red);
            box-shadow: 0 0 40px rgba(225, 6, 0, 0.8);
            background: #000;
        }

        .lightbox img {
            display: block;
            max-width: 90vw;
            max-height: 85vh;
            width: auto;
            height: auto;
        }

        .lightbox .lb-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.95));
            color: var(--yellow);
            font-size: 0.95rem;
            letter-spacing: 2px;
            padding: 30px 20px 14px;
            text-align: center;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 212, 0, 0.8);
        }

        .lb-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 44px;
            height: 44px;
            border: 2px solid var(--red);
            background: rgba(0, 0, 0, 0.7);
            color: var(--red-bright);
            font-family: inherit;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            z-index: 101;
        }

        .lb-close:hover,
        .lb-close:focus-visible {
            background: var(--red);
            color: #000;
            box-shadow: 0 0 20px var(--red);
            outline: none;
        }

        .lb-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 70px;
            border: 2px solid var(--yellow);
            background: rgba(0, 0, 0, 0.6);
            color: var(--yellow);
            font-family: inherit;
            font-size: 1.8rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            z-index: 101;
            text-shadow: 0 0 8px var(--yellow);
        }

        .lb-nav:hover,
        .lb-nav:focus-visible {
            background: var(--yellow);
            color: #000;
            box-shadow: 0 0 25px var(--yellow);
            outline: none;
        }

        .lb-prev { left: 20px; }
        .lb-next { right: 20px; }

        .lb-counter {
            position: absolute;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--green);
            font-size: 0.9rem;
            letter-spacing: 3px;
            font-weight: bold;
            text-shadow: 0 0 8px var(--green);
            z-index: 101;
        }

        /* ===== NAV & FOOTER ===== */
        .page-nav {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 35px;
            padding-top: 20px;
            border-top: 1px dashed rgba(255, 212, 0, 0.4);
        }

        .back-link {
            display: inline-block;
            color: var(--yellow);
            text-decoration: none;
            border: 1px solid var(--yellow);
            padding: 8px 16px;
            font-weight: bold;
            font-size: 0.95rem;
            letter-spacing: 1px;
            transition: all 0.2s ease;
        }
        .back-link:hover,
        .back-link:focus-visible {
            background-color: var(--yellow);
            color: #000;
            box-shadow: 0 0 15px var(--yellow);
            outline: none;
        }

        .site-footer {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 212, 0, 0.2);
            font-size: 0.85rem;
            color: rgba(245, 245, 245, 0.7);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            letter-spacing: 1px;
        }

        .site-footer .green {
            color: var(--green);
            text-shadow: 0 0 6px var(--green);
        }

        .cursor-blink {
            animation: blink 1s steps(1) infinite;
            color: var(--green);
        }

        @media (max-width: 600px) {
            body { padding: 20px 12px; }
            .container { padding: 25px 20px; }
            h1 { font-size: 1.4rem; letter-spacing: 2px; }
            .gallery { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
            .photo-card img { height: 130px; }
            .photo-card .caption { font-size: 0.75rem; padding: 18px 8px 8px; }
            .lb-nav { width: 40px; height: 56px; font-size: 1.4rem; }
            .lb-prev { left: 8px; }
            .lb-next { right: 8px; }
            .lb-close { top: 12px; right: 12px; width: 38px; height: 38px; font-size: 1.2rem; }
            .lb-counter { top: 18px; font-size: 0.75rem; }
            .page-nav { flex-direction: column; }
            .back-link { text-align: center; }
        }

        @media (prefers-reduced-motion: reduce) {
            .typewriter::after,
            .cursor-blink,
            .photo-card,
            .photo-card img { animation: none; transition: none; }
        }
    </style>
</head>
<body>

    <canvas id="starsCanvas" aria-hidden="true"></canvas>
    <div class="scanlines" aria-hidden="true"></div>

    <main class="container" role="main">
        <div class="corner tl">+</div>
        <div class="corner tr">+</div>
        <div class="corner bl">+</div>
        <div class="corner br">+</div>

        <h1 class="typewriter" data-text="[ FOTO GALERİ ]"></h1>
        <div class="page-sub"><span style="color:var(--green)">&gt;</span> RedHack arşivinden kareler <span style="color:var(--green)">&lt;</span></div>
        <div class="page-meta">// toplam <span class="green">4</span> görsel — büyütmek için tıkla</div>

        <section class="gallery" aria-label="Fotoğraf galerisi">

            <a class="photo-card" href="barikat.png" data-caption="BARİKAT">
                <img src="barikat.png" alt="Barikat"
                     onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'300\' height=\'200\'><rect width=\'100%\' height=\'100%\' fill=\'%231a0000\' stroke=\'%23e10600\' stroke-width=\'2\'/><text x=\'50%\' y=\'50%\' fill=\'%23ffd400\' font-family=\'monospace\' font-size=\'14\' text-anchor=\'middle\'>[ barikat.png ]</text></svg>';">
                <span class="caption">BARİKAT</span>
            </a>

            <a class="photo-card" href="kızıl.png" data-caption="KIZIL">
                <img src="kızıl.png" alt="Kızıl"
                     onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'300\' height=\'200\'><rect width=\'100%\' height=\'100%\' fill=\'%231a0000\' stroke=\'%23e10600\' stroke-width=\'2\'/><text x=\'50%\' y=\'50%\' fill=\'%23ffd400\' font-family=\'monospace\' font-size=\'14\' text-anchor=\'middle\'>[ kızıl.png ]</text></svg>';">
                <span class="caption">KIZIL</span>
            </a>

            <a class="photo-card" href="pişman.png" data-caption="PİŞMAN">
                <img src="pişman.png" alt="Pişman"
                     onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'300\' height=\'200\'><rect width=\'100%\' height=\'100%\' fill=\'%231a0000\' stroke=\'%23e10600\' stroke-width=\'2\'/><text x=\'50%\' y=\'50%\' fill=\'%23ffd400\' font-family=\'monospace\' font-size=\'14\' text-anchor=\'middle\'>[ pişman.png ]</text></svg>';">
                <span class="caption">PİŞMAN</span>
            </a>

            <a class="photo-card" href="1mayis.png" data-caption="1 MAYIS">
                <img src="1mayis.png" alt="1 Mayıs"
                     onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'300\' height=\'200\'><rect width=\'100%\' height=\'100%\' fill=\'%231a0000\' stroke=\'%23e10600\' stroke-width=\'2\'/><text x=\'50%\' y=\'50%\' fill=\'%23ffd400\' font-family=\'monospace\' font-size=\'14\' text-anchor=\'middle\'>[ 1mayis.png ]</text></svg>';">
                <span class="caption">1 MAYIS</span>
            </a>

        </section>

        <nav class="page-nav" aria-label="Alt sayfa navigasyonu">
            <a href="../index.html" class="back-link">&lt;&lt; ANA SAYFA</a>
            <a href="../biz-kimiz/index.html" class="back-link">BİZ KİMİZ &gt;&gt;</a>
        </nav>

        <footer class="site-footer">
            <span><span class="green">&gt;</span> RedHack</span>
            <span><span class="green">&gt;</span> halk için hack <span class="cursor-blink">_</span></span>
        </footer>
    </main>

    <!-- ===== LIGHTBOX ===== -->
    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Fotoğraf görüntüleyici">
        <div class="lb-counter" id="lbCounter">1 / 4</div>
        <button class="lb-close" id="lbClose" aria-label="Kapat">×</button>
        <button class="lb-nav lb-prev" id="lbPrev" aria-label="Önceki">‹</button>
        <div class="lb-img-wrap">
            <img id="lbImg" src="" alt="">
            <div class="lb-caption" id="lbCaption"></div>
        </div>
        <button class="lb-nav lb-next" id="lbNext" aria-label="Sonraki">›</button>
    </div>

    <script>
    (function () {
        const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        // ===== CANVAS — KIZIL + SARI + YEŞİL + BEYAZ YILDIZLAR =====
        const canvas = document.getElementById('starsCanvas');
        const ctx = canvas.getContext('2d');
        let stars = [];
        let numStars = 0;

        const PALETTE = [
            { r: 225, g: 6,   b: 0   },
            { r: 255, g: 43,  b: 43  },
            { r: 255, g: 212, b: 0   },
            { r: 0,   g: 255, b: 65  },
            { r: 245, g: 245, b: 245 }
        ];
        const COLOR_WEIGHTS = [0.30, 0.15, 0.30, 0.15, 0.10];

        function pickColor() {
            const r = Math.random();
            let acc = 0;
            for (let i = 0; i < COLOR_WEIGHTS.length; i++) {
                acc += COLOR_WEIGHTS[i];
                if (r <= acc) return PALETTE[i];
            }
            return PALETTE[0];
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            numStars = Math.min(200, Math.floor((canvas.width * canvas.height) / 12000));
        }

        function drawFivePointStar(cx, cy, spikes, outerRadius, innerRadius, alpha, color) {
            let rot = Math.PI / 2 * 3;
            let x = cx, y = cy;
            const step = Math.PI / spikes;

            ctx.save();
            ctx.beginPath();
            ctx.moveTo(cx, cy - outerRadius);
            for (let i = 0; i < spikes; i++) {
                x = cx + Math.cos(rot) * outerRadius;
                y = cy + Math.sin(rot) * outerRadius;
                ctx.lineTo(x, y);
                rot += step;

                x = cx + Math.cos(rot) * innerRadius;
                y = cy + Math.sin(rot) * innerRadius;
                ctx.lineTo(x, y);
                rot += step;
            }
            ctx.lineTo(cx, cy - outerRadius);
            ctx.closePath();

            ctx.fillStyle = `rgba(${color.r}, ${color.g}, ${color.b}, ${alpha})`;
            ctx.shadowBlur = 14;
            ctx.shadowColor = `rgb(${color.r}, ${color.g}, ${color.b})`;
            ctx.fill();
            ctx.restore();
        }

        class Star {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.outerRadius = Math.random() * 5 + 3;
                this.innerRadius = this.outerRadius / 2;
                this.alpha = Math.random() * 0.7 + 0.15;
                this.speed = Math.random() * 0.02 + 0.005;
                this.increasing = Math.random() > 0.5;
                this.color = pickColor();
            }
            draw() {
                drawFivePointStar(ctx, this.x, this.y, 5, this.outerRadius, this.innerRadius, this.alpha, this.color);
            }
            update() {
                if (this.increasing) {
                    this.alpha += this.speed;
                    if (this.alpha >= 0.9) this.increasing = false;
                } else {
                    this.alpha -= this.speed;
                    if (this.alpha <= 0.08) {
                        this.increasing = true;
                        this.color = pickColor();
                    }
                }
            }
        }

        function initStars() {
            stars = [];
            for (let i = 0; i < numStars; i++) stars.push(new Star());
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (const s of stars) { s.update(); s.draw(); }
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => { resizeCanvas(); initStars(); });
        resizeCanvas();
        initStars();

        if (reduced) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(s => s.draw());
        } else {
            animate();
        }

        // ===== TYPEWRITER BAŞLIK =====
        const title = document.querySelector('.typewriter');
        if (title) {
            const text = title.dataset.text || title.textContent;
            title.textContent = '';
            if (reduced) {
                title.textContent = text;
            } else {
                let i = 0;
                const tick = () => {
                    if (i <= text.length) {
                        title.textContent = text.slice(0, i);
                        i++;
                        setTimeout(tick, 60);
                    }
                };
                tick();
            }
        }

        // ===== LIGHTBOX =====
        const cards = Array.from(document.querySelectorAll('.photo-card'));
        const lightbox = document.getElementById('lightbox');
        const lbImg = document.getElementById('lbImg');
        const lbCaption = document.getElementById('lbCaption');
        const lbCounter = document.getElementById('lbCounter');
        const lbClose = document.getElementById('lbClose');
        const lbPrev = document.getElementById('lbPrev');
        const lbNext = document.getElementById('lbNext');

        let currentIndex = 0;

        const photos = cards.map(card => ({
            src: card.getAttribute('href'),
            caption: card.dataset.caption || card.querySelector('.caption')?.textContent || ''
        }));

        function showLightbox(index) {
            currentIndex = (index + photos.length) % photos.length;
            const p = photos[currentIndex];
            lbImg.src = p.src;
            lbImg.alt = p.caption;
            lbCaption.textContent = p.caption;
            lbCounter.textContent = `${currentIndex + 1} / ${photos.length}`;
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
            lbClose.focus();
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = '';
            cards[currentIndex]?.focus();
        }

        cards.forEach((card, i) => {
            card.addEventListener('click', (e) => {
                e.preventDefault();
                showLightbox(i);
            });
        });

        lbClose.addEventListener('click', closeLightbox);
        lbPrev.addEventListener('click', () => showLightbox(currentIndex - 1));
        lbNext.addEventListener('click', () => showLightbox(currentIndex + 1));

        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) closeLightbox();
        });

        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('active')) return;
            if (e.key === 'Escape') closeLightbox();
            else if (e.key === 'ArrowLeft') showLightbox(currentIndex - 1);
            else if (e.key === 'ArrowRight') showLightbox(currentIndex + 1);
        });
    })();
    </script>
</body>
</html>
